name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests
        run: pytest -q

      - name: Fuzz gate (toy_crash 20s)
        run: kavach fuzz --target toy_crash --time 20

      - name: Verify crash found
        run: |
          LATEST=$(ls -1d campaigns/toy_crash-* 2>/dev/null | sort | tail -1)
          if [ -z "$LATEST" ]; then echo "No campaign found"; exit 1; fi
          CRASHES=$(jq '.crashes' "$LATEST/stats.json")
          echo "Crashes: $CRASHES"
          if [ "$CRASHES" -lt 1 ]; then echo "Expected ≥1 crash"; exit 1; fi
